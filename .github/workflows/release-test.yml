name: Release Test Build

# test 分支：push 即自动构建 Windows 安装包，发布到固定的「test」pre-release。
# 统一标题「FluxReader Test Build」，产物文件名带 commit 短哈希区分历史构建。

on:
  push:
    branches: [test]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build (Tauri: NSIS + MSI)
        run: npm run tauri build

      - name: Rename artifacts with commit short SHA
        shell: pwsh
        run: |
          $sha = "${{ github.sha }}".Substring(0, 8)
          Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | ForEach-Object {
            $new = $_.FullName -replace '\.exe$', "-$sha.exe"
            Rename-Item $_.FullName $new
          }
          Get-ChildItem "src-tauri/target/release/bundle/msi/*.msi" | ForEach-Object {
            $new = $_.FullName -replace '\.msi$', "-$sha.msi"
            Rename-Item $_.FullName $new
          }

      - name: Publish to rolling "test" pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $notes = @"
          测试分支自动构建（阶段 0 止血 0.12.1 开发中）。

          本包对应 commit：${{ github.sha }}

          > 这是测试用预发布包，勿用于生产。
          "@
          # 滚动 tag：删除旧 release + 旧 tag，强制指向当前 commit，再重建。
          # 保证「统一 title、文件名带 commit 区分」且不累积旧资产。
          gh release delete "test" --yes --cleanup-tag 2>$null
          gh release create "test" `
            --title "FluxReader Test Build" `
            --prerelease `
            --target "${{ github.sha }}" `
            --notes $notes `
            "src-tauri/target/release/bundle/nsis/*.exe" `
            "src-tauri/target/release/bundle/msi/*.msi"
