name: CI

on:
  # 分支与 PR 使用同一套门禁；发布 tag 由 release.yml 调用本提交的工作流，
  # 避免独立 tag CI 与 Release 重复运行、轮询历史结果造成歧义。
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_call:

# CI 的 GITHUB_TOKEN 只被 checkout 消费（只读）：显式收口最小权限，
# 与 release.yml 的 job 级 contents: write 形成分域。
permissions:
  contents: read

jobs:
  frontend:
    name: Lint, build & frontend regressions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        id: node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        id: install
        run: npm ci

      - name: Release workflow regression
        if: ${{ (success() || failure()) && steps.checkout.outcome == 'success' && steps.node.outcome == 'success' }}
        run: node --test tools/release/release.test.mjs

      # Note: 四个前端门禁各自可跑、失败信息指向自身——lint/build 的任一失败不得
      # 挡住后面的状态与挂载回归；安装失败时后续步骤没有可执行前提，才统一跳过。
      # 任一失败仍让 job 变红，不用 continue-on-error 掩盖。理由与断言纪律见
      # .agents/notes/implemented/testing/2026-09-16-测试门禁与断言纪律.md
      - name: Lint (oxlint)
        if: ${{ (success() || failure()) && steps.checkout.outcome == 'success' && steps.node.outcome == 'success' && steps.install.outcome == 'success' }}
        run: npm run lint

      - name: Build (tsc + vite)
        if: ${{ (success() || failure()) && steps.checkout.outcome == 'success' && steps.node.outcome == 'success' && steps.install.outcome == 'success' }}
        run: npm run build

      # Note: 前端回归接入 CI 的理由——它是纯逻辑状态机断言（node 直跑，不需浏览器），
      # 能在几十毫秒内拦住 store/selector 的行为回归；备选是 Playwright 级 UI 测试，
      # 但更慢更脆，故作为补充而非替代。
      - name: Frontend regression (node state-machine checks)
        if: ${{ (success() || failure()) && steps.checkout.outcome == 'success' && steps.node.outcome == 'success' && steps.install.outcome == 'success' }}
        run: npm run test:frontend

      # Note: 真实挂载回归（OPT-016B）——jsdom + React createRoot/act 挂载生产组件，
      # 覆盖 effect/事件/异步链与真实 DOM 契约（ReaderProse 源码态、Timeline 五布局、
      # CloseAskDialog 键盘、正文水合），与上面的纯逻辑通道共用同一份 loader 与
      # store/bodyCache 实例。不跑 effect 的 SSR/静态断言不能替代它，故单列一步。
      - name: Component mount regression (jsdom + React act)
        if: ${{ (success() || failure()) && steps.checkout.outcome == 'success' && steps.node.outcome == 'success' && steps.install.outcome == 'success' }}
        run: npm run test:components

  ui-layout:
    name: UI layout & social hydration (Edge CDP)
    # 真实 Chromium 几何验收：jsdom 的 offsetHeight/getBoundingClientRect 是替身，
    # 无法拦截 footer 被 flex 压缩或社交正文先以完整高度进入布局。windows-latest
    # 自带 Edge；脚本启动本地 Vite + headless Edge，失败时在日志与 tmp 证据中给出
    # 首屏/底部截图和逐帧 metrics（tmp/ 不入库，CI 只以退出码为门禁）。
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Real browser layout regression
        env:
          UI_LAYOUT_TRACE: viewport
        run: npm run test:ui-layout

      - name: Upload UI layout evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-layout-evidence
          path: tmp/ui-layout-evidence/
          if-no-files-found: warn

  rust:
    name: Check & test Rust (src-tauri)
    # 纯 Windows 客户端：DPAPI 凭据加密、SMTC 媒体控制等 Windows 专有功能
    # 只在 Windows 编译。若在 Linux 上跑，clippy/test 检查的是 #[cfg(not(windows))]
    # 降级分支（生产环境根本不执行），真正的 Windows 代码路径反而被跳过，
    # 与 release workflow（windows-latest）平台不一致。故 rust job 固定在 Windows。
    runs-on: windows-latest
    # Note: 基线约 9 分钟；不设上限时挂起的测试会占满 360 分钟默认超时。
    # 45 分钟 = 5 倍基线余量，同时把病态挂起压缩为快速失败并可取日志。
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        id: checkout
        with:
          ref: ${{ github.sha }}

      - name: Setup Rust
        id: toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy

      - name: Cache Rust build
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri

      # Note: 格式门禁的设立理由——此前的提交里混用过不同缩进/换行风格，
      # 产生大量纯排版 diff 干扰代码审查；统一为 rustfmt 默认风格后由 CI 守住。
      # Note: 各 Rust 门禁必须各自独立可跑、失败信息指向自身原因——中间门禁挡住后置
      # 门禁等于没有门禁（曾因 fmt 排在 clippy/test 之前掩盖两个真实缺陷）。下面前四步
      # 均带明确执行条件：前置门禁无论成功或失败都继续（success() || failure()），
      # 但只在 checkout 与 toolchain 正常时运行——否则错误会指向缺失的工程而非真实
      # 原因；任一失败步骤都会让 job 变红，不用 continue-on-error 掩盖。理由与断言
      # 纪律见 .agents/notes/implemented/testing/2026-09-16-测试门禁与断言纪律.md
      - name: Format (cargo fmt --check)
        if: ${{ (success() || failure()) && steps.checkout.outcome == 'success' && steps.toolchain.outcome == 'success' }}
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Type check (cargo check)
        if: ${{ (success() || failure()) && steps.checkout.outcome == 'success' && steps.toolchain.outcome == 'success' }}
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Lint (clippy, deny warnings)
        if: ${{ (success() || failure()) && steps.checkout.outcome == 'success' && steps.toolchain.outcome == 'success' }}
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      # 默认 cargo test 自动发现 tests/*.rs；六套自托管 mock 与 ingestion/
      # scheduler 均无 #[ignore]，由这一步完整执行一次。真实账户 live 测试
      # 继续保持 ignored，只有具体任务另行约定外部读写边界后才显式运行。
      - name: Run tests (unit and all non-ignored integrations)
        if: ${{ (success() || failure()) && steps.checkout.outcome == 'success' && steps.toolchain.outcome == 'success' }}
        run: cargo test --manifest-path src-tauri/Cargo.toml --no-fail-fast
