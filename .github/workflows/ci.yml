name: CI

on:
  # dev 为开发分支（携带工作流记录），推送即跑 CI，供合并进 main 前的验证；
  # main 为纯项目代码主分支，发布 tag 的 CI 门控依赖本工作流在 main 上的运行。
  # v* tag push 同样触发本工作流（只做门禁，不自动发布）：release.yml 要求
  # tagged commit 上 ci.yml 全绿，而 tag 可能指向没有 main/dev push run 的提交
  # ——此前会让门禁空等 45 分钟超时，tag 触发补齐该 run。
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Type-check, lint & build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Build (tsc + vite)
        run: npm run build

      # Note: 前端回归接入 CI 的理由——它是纯逻辑状态机断言（node 直跑，不需浏览器），
      # 能在几十毫秒内拦住 store/selector 的行为回归；备选是 Playwright 级 UI 测试，
      # 但更慢更脆，故作为补充而非替代。
      - name: Frontend regression (node state-machine checks)
        run: npm run test:frontend

      # Note: 真实挂载回归（OPT-016B）——jsdom + React createRoot/act 挂载生产组件，
      # 覆盖 effect/事件/异步链与真实 DOM 契约（ReaderProse 源码态、Timeline 五布局、
      # CloseAskDialog 键盘、正文水合），与上面的纯逻辑通道共用同一份 loader 与
      # store/bodyCache 实例。不跑 effect 的 SSR/静态断言不能替代它，故单列一步。
      - name: Component mount regression (jsdom + React act)
        run: npm run test:components

  rust:
    name: Check & test Rust (src-tauri)
    # 纯 Windows 客户端：DPAPI 凭据加密、SMTC 媒体控制等 Windows 专有功能
    # 只在 Windows 编译。若在 Linux 上跑，clippy/test 检查的是 #[cfg(not(windows))]
    # 降级分支（生产环境根本不执行），真正的 Windows 代码路径反而被跳过，
    # 与 release workflow（windows-latest）平台不一致。故 rust job 固定在 Windows。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        id: checkout

      - name: Setup Rust
        id: toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Note: 格式门禁的设立理由——此前的提交里混用过不同缩进/换行风格，
      # 产生大量纯排版 diff 干扰代码审查；统一为 rustfmt 默认风格后由 CI 守住。
      # Note: 各 Rust 门禁必须各自独立可跑、失败信息指向自身原因——中间门禁挡住后置
      # 门禁等于没有门禁（曾因 fmt 排在 clippy/test 之前掩盖两个真实缺陷）。下面前四步
      # 均带明确执行条件：前置门禁无论成功或失败都继续（success() || failure()），
      # 但只在 checkout 与 toolchain 正常时运行——否则错误会指向缺失的工程而非真实
      # 原因；任一失败步骤都会让 job 变红，不用 continue-on-error 掩盖。理由与断言
      # 纪律见 .agents/notes/implemented/testing/2026-09-16-测试门禁与断言纪律.md
      - name: Format (cargo fmt --check)
        if: ${{ (success() || failure()) && steps.checkout.outcome == 'success' && steps.toolchain.outcome == 'success' }}
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Lint (clippy, deny warnings)
        if: ${{ (success() || failure()) && steps.checkout.outcome == 'success' && steps.toolchain.outcome == 'success' }}
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Run tests
        if: ${{ (success() || failure()) && steps.checkout.outcome == 'success' && steps.toolchain.outcome == 'success' }}
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # 注意：这里必须用 --include-ignored（跑「非 ignored + ignored 全部」），
      # 不能用 --ignored（只跑被标 #[ignore] 的）。这 6 个自托管 mock 套件里
      # 一个 #[ignore] 都没有 —— 若写成 --ignored，本步骤会匹配 0 个用例却依然绿灯，
      # 等于整条 mock 集成测试通道从未在 CI 里真正跑过。各文件头部文档写的也是
      # --include-ignored（如 account_lifecycle_e2e.rs 的运行示例）。
      # 注意：ingestion_e2e / scheduler_e2e 各自自托管 127.0.0.1 临时 feed 服务
      # （OPT-016A，无 #[ignore]），由上面的默认 `cargo test` 步骤真实执行。
      - name: Run self-hosted mock integration tests (core sync/AI protocols)
        if: ${{ (success() || failure()) && steps.checkout.outcome == 'success' && steps.toolchain.outcome == 'success' }}
        run: cargo test --manifest-path src-tauri/Cargo.toml --test account_lifecycle_e2e --test ai_e2e --test dual_client_e2e --test sync_content_e2e --test sync_e2e --test sync_phases_e2e -- --include-ignored
