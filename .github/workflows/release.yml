name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # ISSUE-004 加固：tagged commit 的 CI 工作流必须全部成功，才允许进入构建与发布。
      # 只监视 ci.yml 的运行（本工作流自身也会在该提交上注册 check-run，
      # 若监视 check-runs 会把自己也算进去造成死锁——v0.13.0 首次运行已验证此坑）。
      - name: Require green CI on the tagged commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sha = (git rev-parse HEAD)
          $deadline = (Get-Date).ToUniversalTime().AddMinutes(45)
          while ($true) {
            $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
            $uri = "https://api.github.com/repos/$($env:GITHUB_REPOSITORY)/actions/runs?head_sha=$sha&per_page=100"
            $ci = @((Invoke-RestMethod -Uri $uri -Headers $headers).workflow_runs | Where-Object { $_.path -eq '.github/workflows/ci.yml' })
            $pending = @($ci | Where-Object { $_.status -ne 'completed' })
            $failed = @($ci | Where-Object { $_.status -eq 'completed' -and $_.conclusion -ne 'success' })
            Write-Host "CI runs on ${sha}: total=$($ci.Count) pending=$($pending.Count) failed=$($failed.Count)"
            if ($failed.Count -gt 0) { throw "CI failed on tagged commit $sha — refusing to release" }
            if ($ci.Count -gt 0 -and $pending.Count -eq 0) { Write-Host "All CI runs succeeded on $sha"; break }
            if ((Get-Date).ToUniversalTime() -gt $deadline) { throw "Timed out waiting for CI on $sha" }
            Start-Sleep -Seconds 30
          }

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "FluxReader ${{ github.ref_name }}"
          releaseBody: |
            FluxReader ${{ github.ref_name }}

            完整变更说明见该版本标签对应的提交历史与合并记录；每次发布的变更说明随发布决定单独提供，不再内置于工作流（防止旧版本文案随新版本发布）。
          releaseDraft: false
          prerelease: false
          args: ""
