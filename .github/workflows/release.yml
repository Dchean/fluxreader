name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

# GitHub 默认只保留一个 pending run；发布 tag 应逐版推送并等本版结束。
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate release tag and versions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.validate.outputs.tag }}
      version: ${{ steps.validate.outputs.version }}
      sha: ${{ steps.validate.outputs.sha }}
      body_b64: ${{ steps.validate.outputs.body_b64 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version

      # tag 附注保持数据形态，不拼进 shell；检查在依赖安装和构建前完成。
      - name: Validate annotated tag, main ancestry and all version files
        id: validate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/release/release-lib.mjs preflight

  ci:
    name: Required CI on the release commit
    needs: preflight
    uses: ./.github/workflows/ci.yml

  release:
    name: Build and publish Windows packages
    needs: [preflight, ci]
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
      RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
      RELEASE_SHA: ${{ needs.preflight.outputs.sha }}
      RELEASE_BODY_B64: ${{ needs.preflight.outputs.body_b64 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Recheck fixed checkout and tag before building
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/release/release-lib.mjs validate-checkout

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      # 只构建：不传 tagName/releaseName/releaseId，tauri-action 不写 Release。
      # 先构建、草稿验包后公开；已发布版本不重写，见发布说明 Note。
      - name: Build Windows installers
        id: build
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        with:
          args: ""

      - name: Validate installer names, versions and contents
        env:
          ARTIFACT_MANIFEST_PATH: ${{ runner.temp }}/fluxreader-release-artifacts.json
          EXPECTED_VERSION: ${{ needs.preflight.outputs.version }}
          TAURI_ARTIFACT_PATHS: ${{ steps.build.outputs.artifactPaths }}
          TAURI_APP_VERSION: ${{ steps.build.outputs.appVersion }}
        run: node tools/release/release-lib.mjs validate-artifacts

      # 只有本轮完整构建可创建/恢复草稿。上传失败留草稿；逐资产验 hash 后才公开。
      - name: Upload, verify and publish draft release
        env:
          ARTIFACT_MANIFEST_PATH: ${{ runner.temp }}/fluxreader-release-artifacts.json
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/release/release-lib.mjs publish
