name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # ISSUE-004 加固：tagged commit 的 CI 工作流必须全部成功，才允许进入构建与发布。
      # 只监视 ci.yml 的运行（本工作流自身也会在该提交上注册 check-run，
      # 若监视 check-runs 会把自己也算进去造成死锁——v0.13.0 首次运行已验证此坑）。
      - name: Require green CI on the tagged commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sha = (git rev-parse HEAD)
          $deadline = (Get-Date).ToUniversalTime().AddMinutes(45)
          while ($true) {
            $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
            $uri = "https://api.github.com/repos/$($env:GITHUB_REPOSITORY)/actions/runs?head_sha=$sha&per_page=100"
            $ci = @((Invoke-RestMethod -Uri $uri -Headers $headers).workflow_runs | Where-Object { $_.path -eq '.github/workflows/ci.yml' })
            $pending = @($ci | Where-Object { $_.status -ne 'completed' })
            $failed = @($ci | Where-Object { $_.status -eq 'completed' -and $_.conclusion -ne 'success' })
            Write-Host "CI runs on ${sha}: total=$($ci.Count) pending=$($pending.Count) failed=$($failed.Count)"
            if ($failed.Count -gt 0) { throw "CI failed on tagged commit $sha — refusing to release" }
            if ($ci.Count -gt 0 -and $pending.Count -eq 0) { Write-Host "All CI runs succeeded on $sha"; break }
            if ((Get-Date).ToUniversalTime() -gt $deadline) { throw "Timed out waiting for CI on $sha" }
            Start-Sleep -Seconds 30
          }

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      # 发布文案规范（v0.16.0 起）：annotated tag 附注即 Release 正文。
      # 手动触发（无 tag）时回退到静态说明。
      # v0.16.1 修正：actions/checkout 浅检出会把 annotated tag 变成轻量引用，
      # `git tag -l --format=%(contents)` 读到的是提交信息而非附注（v0.16.1 #30
      # 正文变成 bump 提交信息的根因）——改用 GitHub API 读 tag 对象拿完整附注。
      - name: Set release body from tag annotation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $body = "FluxReader（手动触发，无 tag 附注）`n`n完整变更说明见该提交对应的提交历史与合并记录。"
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
            $ref = Invoke-RestMethod -Uri "https://api.github.com/repos/$($env:GITHUB_REPOSITORY)/git/ref/tags/$($env:GITHUB_REF_NAME)" -Headers $headers
            $tagObj = Invoke-RestMethod -Uri "https://api.github.com/repos/$($env:GITHUB_REPOSITORY)/git/tags/$($ref.object.sha)" -Headers $headers
            if ($tagObj.type -eq 'tag' -and $tagObj.message -and $tagObj.message.Trim()) {
              $body = $tagObj.message
            } else {
              throw "Tag $($env:GITHUB_REF_NAME) is lightweight or has no annotation — push an annotated tag (git tag -a)."
            }
          }
          "RELEASE_BODY<<RELEASE_BODY_GITHUB_ENV_EOF" | Add-Content -Path $env:GITHUB_ENV
          $body | Add-Content -Path $env:GITHUB_ENV
          "RELEASE_BODY_GITHUB_ENV_EOF" | Add-Content -Path $env:GITHUB_ENV
          Write-Host "Release body ready ($(@($body).Count) lines)"

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "FluxReader ${{ github.ref_name }}"
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: false
          prerelease: false
          args: ""

      # 双保险：构建发布完成后，强制把 Release 正文回写为 tag 附注——
      # tauri-action 对已存在的 Release 不保证更新 body（v0.16.1 #30 的另一教训）。
      - name: Ensure release body matches tag annotation
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/$($env:GITHUB_REPOSITORY)/releases/tags/$($env:GITHUB_REF_NAME)" -Headers $headers
          $payload = @{ body = $env:RELEASE_BODY } | ConvertTo-Json
          Invoke-RestMethod -Method PATCH -Uri "https://api.github.com/repos/$($env:GITHUB_REPOSITORY)/releases/$($release.id)" -Headers $headers -ContentType 'application/json' -Body $payload | Out-Null
          Write-Host "Release $($release.id) body updated from tag annotation ($($release.assets_count ?? 0) assets)"
