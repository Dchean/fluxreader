name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # ISSUE-004 加固：同一提交的 CI 必须全部成功，才允许进入构建与发布。
      # 任一 check-run 失败 → 本发布失败；未完成 → 轮询等待；超时 → 失败。
      - name: Require green CI on the tagged commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sha = (git rev-parse HEAD)
          $deadline = (Get-Date).ToUniversalTime().AddMinutes(45)
          while ($true) {
            $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
            $uri = "https://api.github.com/repos/$($env:GITHUB_REPOSITORY)/commits/$sha/check-runs?per_page=100"
            $runs = (Invoke-RestMethod -Uri $uri -Headers $headers).check_runs
            $pending = @($runs | Where-Object { $_.status -ne 'completed' })
            $failed = @($runs | Where-Object { $_.status -eq 'completed' -and $_.conclusion -ne 'success' })
            Write-Host "check-runs on ${sha}: total=$($runs.Count) pending=$($pending.Count) failed=$($failed.Count)"
            if ($failed.Count -gt 0) { throw "CI check-runs failed on tagged commit $sha — refusing to release" }
            if ($runs.Count -gt 0 -and $pending.Count -eq 0) { Write-Host "All CI checks succeeded on $sha"; break }
            if ((Get-Date).ToUniversalTime() -gt $deadline) { throw "Timed out waiting for CI check-runs on $sha" }
            Start-Sleep -Seconds 30
          }

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "FluxReader ${{ github.ref_name }}"
          releaseBody: |
            FluxReader ${{ github.ref_name }}

            完整变更说明见该版本标签对应的提交历史与合并记录；每次发布的变更说明随发布决定单独提供，不再内置于工作流（防止旧版本文案随新版本发布）。
          releaseDraft: false
          prerelease: false
          args: ""
