name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "FluxReader ${{ github.ref_name }}"
          releaseBody: |
            本版本新增 Fever 协议同步，并支持在 Google Reader 与 Fever 之间下拉切换。

            ## 新功能

            - **Fever 协议同步**：完整实现 Fever v3 客户端（`api_key=md5(username:password)` 认证、feeds/groups、items 分页、unread/saved 权威对账、mark 逐条标读/收藏）
            - **同步协议下拉选择**：设置页可在 **Google Reader（推荐）/ Fever** 之间切换，共用同一套集成凭据，切协议不丢绑定（remote id 同源）
            - **Fever 半自动化同步**：since_id + with_ids 分页拉取，未读/收藏由 `unread_item_ids`/`saved_item_ids` 精确对账

            ## 改进

            - Google Reader 轻量同步新增 read/starred 权威 id 集合对账，修复「手机很久前标读/收藏」漏同步
            - 已有条目正文/封面/enclosure 兜底回填（本地为空才补，不覆盖已有内容）
            - 清理 Miniflux 命名残留（注释/日志 protocol-neutral：`origin='remote'`、后端自动同步）

            ## 修复

            - 修正 mock Google Reader 的 `ot` 游标语义（按 changed_at 过滤）与 read/starred stream 状态过滤，消除 3 个既有同步回归测试失败

            ## 数据迁移

            - 新增 settings 键 `sync_protocol`（greader|fever，默认 greader）与 `sync_last_entry_id`（Fever since_id 游标）；无 schema 迁移
          releaseDraft: false
          prerelease: false
          args: ""
